name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker-dropin.js'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Secrets are pushed on every deploy so Cloudflare and this repo cannot drift.
          secrets: |
            RESEND_API_KEY
            GSHEET_WEBHOOK_URL
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
