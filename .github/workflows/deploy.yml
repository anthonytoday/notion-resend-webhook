name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker-dropin.js'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --keep-vars is load-bearing. GSHEET_WEBHOOK_URL and MAILERLITE_GROUP_ID
          # are plaintext vars set in the Cloudflare dashboard and are NOT in
          # wrangler.toml. A plain `wrangler deploy` deletes dashboard vars that the
          # config file does not declare, which would silently break Sheet logging.
          # Encrypted secrets (RESEND_API_KEY) survive a deploy either way.
          command: deploy --keep-vars
