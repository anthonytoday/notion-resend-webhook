name: Deploy worker

# Manual only since 19 Nov 2026 (same pattern as sports-calendar). GitHub-hosted minutes for private
# repos ran out on 8 Nov, so the push trigger failed on 10 Nov. The Worker is deployed by hand today
# (last: 11 Nov). To run this workflow, register a self-hosted runner for this repo on the Hermes VPS
# (label vps; Anthony's one-time token, /opt/gh-runner/setup.sh), then Actions > Deploy worker > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --keep-vars is load-bearing. GSHEET_WEBHOOK_URL and MAILERLITE_GROUP_ID
          # are plaintext vars set in the Cloudflare dashboard and are NOT in
          # wrangler.toml. A plain `wrangler deploy` deletes dashboard vars that the
          # config file does not declare, which would silently break Sheet logging.
          # Encrypted secrets (RESEND_API_KEY) survive a deploy either way.
          command: deploy --keep-vars
