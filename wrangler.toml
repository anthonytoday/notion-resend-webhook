# Renamed from notion-mailerlite-webhook on 10 Nov 2026 (MailerLite is gone).
# Public URL: https://marketplace-downloads-webhook.learningamazonfba.workers.dev/
# This URL is registered as the Webhook URL in the Notion creator profile
# (app.notion.com/profile > Settings). Renaming again changes the URL and breaks
# that registration until it is updated there too.
name = "marketplace-downloads-webhook"
main = "worker-dropin.js"
compatibility_date = "2026-06-11"

[observability]
enabled = true

[vars]
# Resend segment for new downloaders. "General" segment in your account.
RESEND_SEGMENT_ID = "3bd09f4b-0b72-4ed3-b5d2-f4c40dd99bfe"

# Marketplace Downloads database. Declared here on purpose: a wrangler deploy
# REPLACES the dashboard's plain vars, so a value set only in the dashboard would
# be silently wiped by the next push. Secrets are unaffected by this.
NOTION_DB_ID = "23aa8b75-c880-4a26-b0b2-749a5d66f1e3"

# Listings Tracker database. Lets the worker link each download row to its
# listing (Listing relation, matched on Product Slug) so the tracker's Downloads
# rollup stays live. Plain var, declared here for the same reason as NOTION_DB_ID.
NOTION_TRACKER_DB_ID = "8a2abf5c-1628-4048-84c2-6f3f3374a73c"

# Leave commented until the Resend Automation is built and published.
# Setting this makes the worker fire automation triggers.
# RESEND_EVENT_NAME = "template.downloaded"

# Optional: dedupe repeat downloads so they do not re-enroll in the chain.
# Create with: wrangler kv namespace create DEDUPE
# then paste the id below and uncomment.
# [[kv_namespaces]]
# binding = "DEDUPE"
# id = "PASTE_KV_NAMESPACE_ID"

# Secrets (never in this file — set via `wrangler secret put` or GitHub repo secrets):
#   RESEND_API_KEY
#   GSHEET_WEBHOOK_URL
